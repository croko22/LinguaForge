version: "3.9"

services:
  # ── LinguaForge API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/language-app.db
      UPLOAD_DIR: /data/uploads
      TTS_DIR: /data/uploads/tts-cache
      MAX_UPLOAD_SIZE: "52428800"
      LIBRETRANSLATE_ENDPOINT: http://libretranslate:5000
    volumes:
      - linguaforge-data:/data
    depends_on:
      libretranslate:
        condition: service_healthy
    restart: unless-stopped

  # ── LibreTranslate ──────────────────────────────────────────────
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "${LT_PORT:-5000}:5000"
    environment:
      LT_HOST: "0.0.0.0"
      LT_PORT: "5000"
      LT_LOAD_ONLY: "en,es,fr,de,it,pt,ja,ko,zh,ru,nl,pl,tr,sv,da,fi,el,cs,ar"
      LT_THREADS: "4"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  linguaforge-data:
  libretranslate-models:
