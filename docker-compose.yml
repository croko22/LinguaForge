services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "${LT_PORT:-5000}:5000"
    environment:
      LT_HOST: "0.0.0.0"
      LT_PORT: "5000"
      LT_LOAD_ONLY: "en,es,fr,de,it,pt,ja,ko,zh,ru,nl,pl,tr,sv,da,fi,el,cs,ar"
      LT_THREADS: "4"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  libretranslate-models:
