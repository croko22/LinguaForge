repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test (short)
        entry: go test ./... -short
        language: system
        types: [go]
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: frontend test
        entry: npm run test --prefix frontend
        language: system
        files: ^frontend/
        pass_filenames: false
